name: CI

# Runs on every push/PR to dev or main: typecheck + test + production build,
# plus a real `docker build` of the same Dockerfile Render deploys from - so
# a broken build (e.g. something that only fails once dev deps are pruned)
# is caught here, not on Render.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck (shared + server + client)
        run: npm run typecheck

      - name: Test (server + client)
        run: npm run test

      - name: Production build (shared + server + client)
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the exact image Render deploys
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
